name: Fiches des député·e·s

# Les fonctions d'une personne — première ministre, chef de l'opposition, leader
# parlementaire — ne figurent que sur sa fiche individuelle. Les lire demande 98 lectures
# (49 personnes × 2 langues), une toutes les dix secondes comme legnb.ca le demande :
# une quinzaine de minutes. Ces fonctions changent rarement, alors ce travail tourne
# UNE FOIS PAR SEMAINE, et non tous les jours comme le reste.

on:
  schedule:
    # Le lundi, après le rafraîchissement quotidien de 9 h 20 UTC.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiches
  cancel-in-progress: false

jobs:
  fiches:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # La liste des député·e·s d'abord : les fiches partent de ses adresses.
      - name: Lire la liste des député·e·s
        run: node scrapers/nb-deputes.js

      - name: Lire les fiches, dans les deux langues
        run: node scrapers/nb-fiches.js

      - name: Télécharger et réduire les portraits
        run: node scrapers/nb-portraits.js

      - name: Reconstruire les pages
        run: node scripts/build.js

      - name: Publier ce qui a changé
        run: |
          git config user.name 'robot DossierNBrunswick'
          git config user.email 'robot@dossiernbrunswick.ca'
          git add -A
          if git diff --cached --quiet; then
            echo 'Rien n’a changé depuis la semaine dernière.'
            exit 0
          fi
          git commit -m 'Fiches des député·e·s : fonctions, portraits et pages personnelles'
          # Une autre tâche a pu pousser entre-temps : on rejoue par-dessus.
          for essai in 1 2 3; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "tentative $essai échouée, on recommence"
            sleep 10
          done
          exit 1
