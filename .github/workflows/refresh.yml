# Rafraîchissement quotidien des données de DossierNBrunswick.
#
# Chaque matin : relance les scrapers, reconstruit les pages, et pousse s'il y a du nouveau.
# Le push sur `master` déclenche le redéploiement sur Vercel, donc un projet de loi déposé
# la veille à Fredericton se retrouve en ligne sans intervention.
#
# LENT PAR CONSTRUCTION : legnb.ca demande « crawl-delay: 10 » et on le respecte. Avec les
# Journaux de la session à relire, un passage complet prend de dix à quinze minutes. C'est le
# prix d'un accès qu'on garde, et le robot n'est pas pressé.
#
# poppler-utils : second lecteur de PDF, en repli. Le Journal du 14 mai 2026 est refusé par
# pdf-parse mais lu par pdftotext — et il contient deux votes nominatifs. Sans ce paquet, le
# scraper des votes déclarerait le Journal illisible et finirait en erreur.

name: Rafraîchissement quotidien des données

on:
  schedule:
    # 09:20 UTC ≈ 05:20 à Fredericton, après la mise en ligne des documents de la veille.
    - cron: '20 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-nb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer poppler (second lecteur de PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Lire legnb.ca et reconstruire les pages
        run: npm run refresh

      - name: Pousser ce qui a changé
        run: |
          if git diff --quiet; then
            echo "Rien n'a changé : aucun commit."
            exit 0
          fi
          git config user.name "Robot DossierNBrunswick"
          git config user.email "5397133+GrandFFormat@users.noreply.github.com"
          git add -A data index.html en
          git commit -m "Données du jour, lues sur legnb.ca"
          # Quelqu'un a pu pousser pendant la lecture : on se replace avant d'envoyer.
          for essai in 1 2 3; do
            git pull --rebase --autostash origin master && git push origin master && exit 0
            echo "Tentative $essai échouée, nouvelle tentative."
            sleep 10
          done
          exit 1
